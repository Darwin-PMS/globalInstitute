<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Panel - Global Institute</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700;800&display=swap">

    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Admin CSS -->
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

<!-- Login Screen -->
<div id="login-screen" class="login-screen">
    <div class="login-card">
        <div class="login-header text-center">
            <span class="material-symbols-outlined" style="font-size:48px;color:var(--color-primary);">school</span>
            <h1 class="mt-3">Global Institute</h1>
            <p class="text-muted">Admin Panel</p>
        </div>
        <form id="login-form" onsubmit="return AdminApp.login(event)">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" required placeholder="Enter your email" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required placeholder="Enter your password" autocomplete="current-password">
            </div>
            <div id="login-error" class="login-error mt-3" style="display:none"></div>
            <button type="submit" class="btn btn-primary btn-block mt-4" id="login-btn">Sign In</button>
        </form>
        <div class="mt-3 text-center text-small text-muted">
            &copy; 2026 Global Institute
        </div>
    </div>
</div>

    <!-- Admin App -->
    <div id="admin-app" class="admin-app" style="display:none">

        <!-- Sidebar -->
        <aside id="sidebar" class="admin-sidebar">
            <div class="sidebar-brand">
                <span class="brand-icon">GI</span>
                <span class="brand-text">Admin Panel</span>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Nav items injected by JS -->
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <span class="material-symbols-outlined">person</span>
                    <span id="admin-user-name">Admin</span>
                </div>
                <button class="btn-logout" onclick="AdminApp.logout()">
                    <span class="material-symbols-outlined">logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="admin-main">

            <!-- Header -->
            <header class="admin-header">
                <button class="sidebar-toggle" onclick="AdminApp.toggleSidebar()">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <h2 id="page-title" class="page-title">Dashboard</h2>
                <div class="header-actions">
                    <span id="header-actions"></span>
                </div>
            </header>

            <!-- Content Area -->
            <main id="admin-content" class="admin-content">
                <!-- Pages rendered here by JS -->
            </main>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay" style="display:none" onclick="AdminApp.closeModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button class="modal-close" onclick="AdminApp.closeModal()">&times;</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <!-- Admin JS -->
    <script src="/js/admin.js"></script>
</body>
</html>
